name: Build NootedRed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 release
    runs-on: macos-15-intel
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      AppleForgePath: ${{ github.workspace }}/AppleForge
      NRED_BUILD_BRANCH: ci

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source commit
        run: git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Fetch AppleForge
        run: |
          git clone --recurse-submodules \
            https://git.chefkiss.dev/AppleHax/AppleForge.git \
            "$AppleForgePath"

      - name: Install xmake
        run: brew install xmake

      - name: Build x86_64 release
        run: |
          xmake f -m release -a x86_64 -y
          sh tools/build-branch.sh -y

      - name: Verify and stage release
        run: |
          release_dir="build/branches/$NRED_BUILD_BRANCH/macosx/x86_64/release"
          shopt -s nullglob
          release_zips=("$release_dir"/*.zip)

          if (( ${#release_zips[@]} == 0 )); then
            echo "::error::No release ZIP found in $release_dir"
            exit 1
          fi

          if [[ ! -s "$release_dir/NootedRed.kext/Contents/MacOS/NootedRed" ]]; then
            echo "::error::NootedRed.kext is missing or its executable is empty"
            exit 1
          fi

          for release_zip in "${release_zips[@]}"; do
            unzip -tq "$release_zip"
          done

          mkdir -p artifacts
          cp "${release_zips[@]}" SOURCE_COMMIT.txt artifacts/
          (
            cd artifacts
            shasum -a 256 ./*.zip > SHA256SUMS
          )

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: NootedRed-RELEASE
          if-no-files-found: error
          path: artifacts/
