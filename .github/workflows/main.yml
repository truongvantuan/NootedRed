name: Build NootedRed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 release
    runs-on: macos-15-intel
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      AppleForgePath: ${{ github.workspace }}/AppleForge
      NRED_BUILD_BRANCH: ci

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source commit
        run: git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Fetch AppleForge
        run: |
          git clone --recurse-submodules \
            https://git.chefkiss.dev/AppleHax/AppleForge.git \
            "$AppleForgePath"

      - name: Install xmake
        run: brew install xmake

      - name: Build x86_64 release
        run: |
          xmake f -m release -a x86_64 -y
          sh tools/build-branch.sh -y

      - name: Validate combined patch behavior
        run: |
          python3 tools/test_patch_data.py
          python3 tools/test_patchset_selection.py
          python3 tools/test_gl_semantic_data.py
          python3 tools/test_patch_dispatch.py
          python3 tools/test_gl_page_guard.py
          python3 tools/build_opengl_patch.py --check
          python3 tools/test_opengl_native.py
          python3 tools/test_opengl_dynamic.py
          python3 tools/test_opengl_owner.py
          python3 tools/test_gl_validation.py
          python3 tools/test_user_cache_patches.py
          python3 tools/test_user_map_gate.py
          python3 tools/test_user_map_gate.py --sanitize thread
          python3 tools/test_feature_verification.py
          python3 tools/test_gpu_vm_trace.py
          python3 tools/test_gpu_allocation_trace.py
          python3 tools/test_gpu_allocation_capture.py
          python3 tools/test_gl_api_decode.py
          python3 tools/test_gl_budget.py
          python3 tools/test_vcn_multibuild.py
          python3 tools/test_video_modes.py
          python3 tools/test_vda_resolver.py
          python3 tools/gen_media_layout.py --check
          python3 tools/test_codec_guard_payload.py
          python3 tools/test_codec_guard_resolver.py --major 24 --sanitize
          python3 tools/test_codec_guard_resolver.py --major 25 --sanitize
          python3 tools/test_media_exact_plan.py
          python3 tools/test_media_transaction.py
          python3 tools/test_media_safety_adapter.py
          python3 tools/test_surface_profile.py
          python3 tools/test_surface_init.py
          python3 tools/test_exact_cache_resolver.py
          python3 tools/test_surface_exact_plan.py
          python3 tools/test_surface_safety_adapter.py
          python3 tools/test_video_capabilities.py
          python3 tools/test_vcn_gfxoff.py
          python3 tools/test_user_patch_installation.py
          python3 tools/test_vcn_drain.py
          python3 tools/test_vcn_context_trace.py
          python3 tools/test_vcn_trace_capture.py
          python3 tools/test_virtualsmc_startup_readiness.py
          python3 tools/test_hevc_main10_policy.py
          python3 tools/test_heif_inspection.py
          python3 tools/test_heif_export.py
          python3 tools/test_zalo_hevc_guard.py
          python3 tools/test_vcn_encode_pitch.py
          python3 tools/test_dp_recovery.py
          python3 tools/test_atom_loop_guard.py
          python3 tools/test_atom_native_vm.py

      - name: Verify and stage release
        run: |
          release_dir="build/branches/$NRED_BUILD_BRANCH/macosx/x86_64/release"
          shopt -s nullglob
          release_zips=("$release_dir"/*.zip)

          if (( ${#release_zips[@]} == 0 )); then
            echo "::error::No release ZIP found in $release_dir"
            exit 1
          fi

          if [[ ! -s "$release_dir/NootedRed.kext/Contents/MacOS/NootedRed" ]]; then
            echo "::error::NootedRed.kext is missing or its executable is empty"
            exit 1
          fi

          for release_zip in "${release_zips[@]}"; do
            unzip -tq "$release_zip"
          done

          mkdir -p artifacts
          cp "${release_zips[@]}" SOURCE_COMMIT.txt artifacts/
          (
            cd artifacts
            shasum -a 256 ./*.zip > SHA256SUMS
          )

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: NootedRed-RELEASE
          if-no-files-found: error
          path: artifacts/
