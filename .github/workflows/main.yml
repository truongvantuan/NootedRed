name: Build NootedRed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      AppleForgePath: ${{ github.workspace }}/AppleForge
      NRED_BUILD_BRANCH: ci

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source commit
        run: git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Fetch AppleForge
        run: |
          git clone --recurse-submodules \
            https://git.chefkiss.dev/AppleHax/AppleForge.git \
            "$AppleForgePath"

      - name: Install xmake
        run: brew install xmake

      - name: Build x86_64 release
        run: |
          xmake f -m release -a x86_64 -y
          sh tools/build-branch.sh -y

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: NootedRed-RELEASE
          if-no-files-found: error
          path: |
            build/branches/ci/macosx/x86_64/release/*.zip
            SOURCE_COMMIT.txt
